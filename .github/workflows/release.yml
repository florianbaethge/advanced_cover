name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the zip for, e.g. v0.9.0"
        required: true

permissions: {}

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Build advanced_cover.zip
        run: |
          version="$(jq -r .version custom_components/advanced_cover/manifest.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::manifest.json version $version does not match tag $TAG"
            exit 1
          fi
          # HACS expects the integration files at the zip root (hacs.json: zip_release).
          git archive --format=zip -o advanced_cover.zip "HEAD:custom_components/advanced_cover"
          unzip -l advanced_cover.zip | tail -n 1
      - name: Attach to release
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx advanced_cover.zip; then
            echo "advanced_cover.zip is already attached to $TAG, nothing to do."
            exit 0
          fi
          gh release upload "$TAG" advanced_cover.zip
